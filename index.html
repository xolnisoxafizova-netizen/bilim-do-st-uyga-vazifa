<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bilim do'sti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout idea: a squared school notebook (katak daftar) with a red margin line.
     Teachers and students share one "daftar": ink-blue for actions, red pen for marks and grades. */
  --paper: #eef2f8;
  --sheet: #fbfcff;
  --grid: rgba(48, 92, 176, 0.10);
  --ink: #16203a;
  --muted: #5a6683;
  --line: #d9e1ee;
  --siyoh: #2343c4;
  --siyoh-soft: rgba(35, 67, 196, 0.08);
  --on-siyoh: #ffffff;
  --qizil: #cf3534;
  --marker: #ffef9c;
  --sun: #ffcf5a;
  --sky: #dbe5ff;
  --mint: #cfeedd;
  --rose: #ffdcd6;
  --sand: #ffe9c4;
  --lilac: #e6e1ff;
  --good: #1b8048;
  --good-soft: rgba(27, 128, 72, 0.12);
  --warn: #a86a12;
  --warn-soft: rgba(168, 106, 18, 0.13);
  --bad-soft: rgba(207, 53, 52, 0.10);
  --shadow: 0 18px 40px -26px rgba(20, 40, 90, 0.45);
  --display: "Unbounded", "Onest", system-ui, sans-serif;
  --body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --hand: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
  --cell: 22px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0b1120; --sheet: #111a2e; --grid: rgba(130, 160, 230, 0.075); --ink: #e6ebf6; --muted: #97a2be; --line: #243050;
    --siyoh: #8fa6ff; --siyoh-soft: rgba(143, 166, 255, 0.12); --on-siyoh: #0b1120; --qizil: #ff7b72; --marker: rgba(255, 226, 110, 0.20);
    --sun: #e9b949; --sky: #1d2a52; --mint: #173b2d; --rose: #43211f; --sand: #3d2f17; --lilac: #2a2550;
    --good: #52c487; --good-soft: rgba(82, 196, 135, 0.14); --warn: #e2aa4c; --warn-soft: rgba(226, 170, 76, 0.15); --bad-soft: rgba(255, 123, 114, 0.13);
    --shadow: 0 18px 40px -26px rgba(0, 0, 0, 0.9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0b1120; --sheet: #111a2e; --grid: rgba(130, 160, 230, 0.075); --ink: #e6ebf6; --muted: #97a2be; --line: #243050;
  --siyoh: #8fa6ff; --siyoh-soft: rgba(143, 166, 255, 0.12); --on-siyoh: #0b1120; --qizil: #ff7b72; --marker: rgba(255, 226, 110, 0.20);
  --sun: #e9b949; --sky: #1d2a52; --mint: #173b2d; --rose: #43211f; --sand: #3d2f17; --lilac: #2a2550;
  --good: #52c487; --good-soft: rgba(82, 196, 135, 0.14); --warn: #e2aa4c; --warn-soft: rgba(226, 170, 76, 0.15); --bad-soft: rgba(255, 123, 114, 0.13);
  --shadow: 0 18px 40px -26px rgba(0, 0, 0, 0.9);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; min-height: 100%;
  background: var(--paper); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
p { margin: 0; }
a { color: var(--siyoh); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--siyoh); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.hand { font-family: var(--hand); font-weight: 700; }

/* ---------- top bar ---------- */
#top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid transparent; }
.top-inner { max-width: 1200px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
.logo rect { fill: var(--sheet); stroke: var(--line); }
.logo .g { stroke: var(--grid); stroke-width: 1.5; }
.logo .m { stroke: var(--qizil); stroke-width: 2; opacity: 0.7; }
.logo .c { stroke: var(--siyoh); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.wordmark { display: block; font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; line-height: 1.1; }
.tagline { display: block; font-family: var(--hand); font-weight: 700; color: var(--qizil); font-size: 18px; line-height: 1; transform: rotate(-1.5deg); transform-origin: left center; margin-top: 2px; }
.top-actions { display: flex; gap: 8px; align-items: center; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid transparent; border-radius: 12px;
  padding: 10px 18px; min-height: 44px;
  background: var(--siyoh); color: var(--on-siyoh);
  font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: transform 0.12s ease, filter 0.12s ease, background 0.12s ease;
}
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover:not(:disabled) { background: var(--siyoh-soft); filter: none; }
.btn.danger { background: var(--qizil); color: #fff; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn.big { min-height: 52px; padding: 12px 24px; font-size: 16px; border-radius: 14px; }
.btn.wide { width: 100%; }
.linkish { background: none; border: none; padding: 0; color: var(--siyoh); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }

/* ---------- landing ---------- */
.land { max-width: 1200px; margin: 0 auto; padding: 8px 24px 0; }
.hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 32px; align-items: center; padding: 24px 0 40px; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--siyoh); background: var(--siyoh-soft); padding: 6px 12px; border-radius: 999px; }
.hero h1 { font-family: var(--display); font-weight: 700; font-size: clamp(34px, 5vw, 58px); letter-spacing: -0.025em; line-height: 1.05; margin: 18px 0 18px; }
.hero h1 .ul { position: relative; white-space: nowrap; }
.hero h1 .ul::after { content: ""; position: absolute; left: -2%; right: -2%; bottom: 0.02em; height: 0.34em; background: var(--marker); z-index: -1; border-radius: 4px 10px 6px 12px; }
.hero h1 .ul { z-index: 0; isolation: isolate; }
.hero .sub { font-size: 18px; color: var(--muted); max-width: 52ch; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.hero-note { margin-top: 16px; font-family: var(--hand); font-weight: 700; font-size: 21px; color: var(--qizil); transform: rotate(-1deg); }
.hero-ill { width: 100%; height: auto; display: block; max-width: 580px; justify-self: end; }

/* illustration palette */
.i-blob { fill: var(--sky); }
.i-blob2 { fill: var(--sand); }
.i-paper { fill: var(--sheet); stroke: var(--line); stroke-width: 1.5; }
.i-grid { stroke: var(--grid); stroke-width: 1.2; fill: none; }
.i-margin { stroke: var(--qizil); stroke-width: 2; opacity: 0.55; }
.i-ink { fill: var(--siyoh); font-family: var(--hand); font-weight: 700; }
.i-red { fill: var(--qizil); font-family: var(--hand); font-weight: 700; }
.i-stamp { fill: none; stroke: var(--qizil); stroke-width: 3; }
.i-line { fill: var(--line); }
.i-b1 { fill: var(--siyoh); }
.i-b2 { fill: var(--qizil); }
.i-b3 { fill: var(--good); }
.i-b4 { fill: var(--sun); }
.i-band { fill: rgba(255, 255, 255, 0.35); }
.i-pencil { fill: var(--sun); }
.i-wood { fill: #f2d3a8; }
.i-lead { fill: var(--ink); }
.i-eraser { fill: #f08a9a; }
.i-ferrule { fill: #b8c0cf; }
.i-phone { fill: var(--ink); }
.i-screen { fill: var(--sheet); }
.i-card { fill: var(--paper); stroke: var(--line); }
.i-ui { fill: var(--ink); font-family: var(--body); font-weight: 700; }
.i-ui2 { fill: var(--muted); font-family: var(--body); font-weight: 500; }
.i-tag1 { fill: var(--sky); }
.i-tag2 { fill: var(--lilac); }
.i-tagt1 { fill: var(--siyoh); font-family: var(--body); font-weight: 700; }
.i-btn { fill: var(--siyoh); }
.i-btnt { fill: var(--on-siyoh); font-family: var(--body); font-weight: 700; }
.i-bar { fill: var(--line); }
.i-barf { fill: var(--good); }
.i-chip { fill: var(--sheet); stroke: var(--line); }
.i-ok { fill: var(--good); }
.i-okm { fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.i-doc { fill: var(--sheet); stroke: var(--line); stroke-width: 1.5; }
.i-fold { fill: var(--line); }
.i-pdf { fill: var(--qizil); }
.i-pdft { fill: #fff; font-family: var(--body); font-weight: 800; }
.i-stroke { fill: none; stroke: var(--siyoh); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.i-stroke-r { fill: none; stroke: var(--qizil); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.i-stroke-g { fill: none; stroke: var(--good); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.i-soft { fill: var(--siyoh-soft); }
.i-cap { fill: var(--ink); }

.section { padding: 48px 0; }
.section-h { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; max-width: 64ch; }
.section-h h2 { font-family: var(--display); font-weight: 700; font-size: clamp(24px, 3vw, 34px); letter-spacing: -0.015em; }
.section-h p { color: var(--muted); font-size: 17px; }
.roles { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.role {
  position: relative; overflow: hidden;
  background-color: var(--sheet);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: var(--cell) var(--cell);
  border: 1px solid var(--line); border-radius: 20px; padding: 28px 28px 28px 64px; box-shadow: var(--shadow);
}
.role::before { content: ""; position: absolute; top: 0; bottom: 0; left: 44px; width: 2px; background: var(--qizil); opacity: 0.45; }
.role-top { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
.role-top svg { width: 72px; height: 72px; flex: none; }
.role h3 { font-family: var(--display); font-size: 20px; font-weight: 700; }
.role .hand { color: var(--qizil); font-size: 20px; display: block; }
.role ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.role li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; line-height: 22px; }
.role li svg { width: 22px; height: 22px; }
.feats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
.feat { background: var(--sheet); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.feat svg { width: 64px; height: 64px; }
.feat h3 { font-size: 16px; font-weight: 700; }
.feat p { font-size: 14px; color: var(--muted); }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; counter-reset: st; }
.step { position: relative; padding-top: 56px; counter-increment: st; }
.step::before {
  content: counter(st); position: absolute; top: 0; left: 0;
  width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--qizil); color: var(--qizil);
  display: grid; place-items: center; font-family: var(--hand); font-weight: 700; font-size: 26px; background: var(--sheet);
}
.step:not(:last-child)::after { content: ""; position: absolute; top: 22px; left: 56px; right: -8px; border-top: 2px dashed var(--line); }
.step h3 { font-size: 16px; margin-bottom: 6px; }
.step p { font-size: 14px; color: var(--muted); }
.cta-band {
  margin: 24px 0 0; padding: 32px; border-radius: 24px; background: var(--siyoh); color: var(--on-siyoh);
  display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
}
.cta-band h2 { font-family: var(--display); font-size: clamp(22px, 2.6vw, 30px); }
.cta-band p { opacity: 0.85; margin-top: 6px; }
.cta-band .btn { background: var(--sheet); color: var(--ink); }
.cta-band .btn.ghost { background: transparent; color: var(--on-siyoh); border-color: color-mix(in srgb, var(--on-siyoh) 45%, transparent); }
.foot { max-width: 1200px; margin: 0 auto; padding: 32px 24px 40px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; color: var(--muted); font-size: 13px; }

/* ---------- auth ---------- */
.auth { max-width: 1000px; margin: 0 auto; padding: 24px 24px 56px; }
.auth-card { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1fr); background: var(--sheet); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; box-shadow: var(--shadow); }
.auth-ill { background: var(--sky); display: grid; place-items: center; padding: 24px; }
.auth-ill svg { width: 100%; max-width: 380px; height: auto; }
.auth-form { padding: 36px; display: flex; flex-direction: column; gap: 16px; }
.auth-form h1 { font-family: var(--display); font-size: 28px; }
.auth.wide { max-width: 860px; }
.reg-card { background: var(--sheet); border: 1px solid var(--line); border-radius: 24px; padding: 32px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 20px; }
.reg-card h1 { font-family: var(--display); font-size: 28px; }
.fieldset { border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.fieldset legend { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; padding: 0; }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .lbl { font-size: 14px; font-weight: 600; }
.field small { color: var(--muted); font-size: 13px; }
.field input, .field select, .field textarea, .inp {
  width: 100%; min-height: 44px; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--paper);
}
.field textarea { resize: vertical; line-height: 22px; }
.field input:focus, .field select:focus, .field textarea:focus, .inp:focus { border-color: var(--siyoh); outline: none; box-shadow: 0 0 0 3px var(--siyoh-soft); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.form-err { padding: 10px 14px; border-radius: 10px; background: var(--bad-soft); color: var(--ink); font-size: 14px; }
.notice { padding: 10px 14px; border-radius: 10px; background: var(--marker); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: transparent; color: var(--ink);
  border-radius: 999px; padding: 6px 12px; min-height: 36px;
  font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.chip:hover { border-color: var(--siyoh); }
.chip[aria-pressed="true"] { background: var(--siyoh); border-color: var(--siyoh); color: var(--on-siyoh); }
.chip .cnt { font-size: 12px; opacity: 0.75; font-variant-numeric: tabular-nums; }
.types { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.type {
  text-align: left; cursor: pointer; border: 1.5px solid var(--line); border-radius: 14px; background: var(--sheet);
  padding: 12px 14px; display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: start;
}
.type svg { width: 36px; height: 36px; }
.type b { display: block; font-size: 15px; }
.type span { font-size: 13px; color: var(--muted); }
.type[aria-pressed="true"] { border-color: var(--siyoh); background: var(--siyoh-soft); }
.drop {
  display: flex; align-items: center; gap: 14px; cursor: pointer;
  border: 1.5px dashed var(--line); border-radius: 14px; padding: 14px; background: var(--paper);
}
.drop:hover, .drop.over { border-color: var(--siyoh); background: var(--siyoh-soft); }
.drop svg { width: 40px; height: 40px; flex: none; }
.drop b { display: block; font-size: 15px; }
.drop span { font-size: 13px; color: var(--muted); }
.drop .thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); flex: none; }
.file-chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; background: var(--siyoh-soft); font-size: 14px; font-weight: 600; }

.qb { display: flex; flex-direction: column; gap: 12px; }
.q { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: var(--paper); display: flex; flex-direction: column; gap: 10px; }
.q-head { display: flex; justify-content: space-between; align-items: center; }
.q-head b { font-family: var(--hand); font-size: 22px; color: var(--qizil); }
.opt { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; }
.opt .letter { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--sheet); border: 1px solid var(--line); }
.opt label.ok { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.opt input[type="radio"] { accent-color: var(--good); width: 18px; height: 18px; }

/* ---------- dashboard ---------- */
.dash { max-width: 1200px; margin: 0 auto; padding: 8px 24px 48px; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 24px; align-items: start; }
.dash-side { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 14px; }
.who { display: flex; gap: 12px; align-items: center; background: var(--sheet); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.who b { display: block; font-size: 15px; line-height: 1.25; }
.who small { display: block; color: var(--muted); font-size: 13px; line-height: 1.35; margin-top: 2px; }
.avatar { width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 15px; background: var(--marker); color: var(--ink); }
.dash-nav { display: flex; flex-direction: column; gap: 4px; background: var(--sheet); border: 1px solid var(--line); border-radius: 16px; padding: 8px; }
.nav-a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; text-decoration: none; color: var(--ink); font-weight: 600; font-size: 15px; }
.nav-a svg { width: 20px; height: 20px; flex: none; color: var(--muted); }
.nav-a:hover { background: var(--siyoh-soft); }
.nav-a[aria-current="page"] { background: var(--siyoh); color: var(--on-siyoh); }
.nav-a[aria-current="page"] svg { color: var(--on-siyoh); }
.nav-a .badge-n { margin-left: auto; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--qizil); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.dash-main { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.sec-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px 20px; flex-wrap: wrap; }
.sec-h h1 { font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
.sec-h p { color: var(--muted); margin-top: 6px; }
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
.card > h2, .card-h2 { font-size: 17px; font-weight: 700; margin-bottom: 14px; }
.form { display: flex; flex-direction: column; gap: 16px; }
.two { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.empty { border: 1.5px dashed var(--line); border-radius: 16px; padding: 24px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty svg { width: 72px; height: 72px; }
.loading-note { padding: 10px 14px; border-radius: 10px; background: var(--siyoh-soft); font-size: 14px; }

.fan { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.fan-1 { background: var(--sky); color: var(--siyoh); }
.fan-2 { background: var(--lilac); color: color-mix(in srgb, var(--siyoh) 60%, #7a2bd6); }

.pill.wait { background: var(--warn-soft); color: var(--warn); }
.pill.late { background: var(--bad-soft); color: var(--qizil); }
.grade { font-family: var(--hand); font-weight: 700; font-size: 28px; line-height: 1; color: var(--qizil); }

.tcards { display: flex; flex-direction: column; gap: 12px; }
.tcard { background: var(--sheet); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.tcard.click { cursor: pointer; text-align: left; width: 100%; color: inherit; }
.tcard.click:hover { border-color: var(--siyoh); }
.tcard-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tcard h3 { font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }

.tcard-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.meter { height: 8px; border-radius: 4px; background: var(--paper); overflow: hidden; border: 1px solid var(--line); }
.meter span { display: block; height: 100%; background: var(--good); border-radius: 4px; }

table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: bottom; }
td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: center; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--sheet); }
.table-wrap table th:first-child, .table-wrap table td:first-child { padding-left: 14px; }
.rep th.task { text-transform: none; letter-spacing: 0; font-size: 12px; white-space: normal; min-width: 96px; max-width: 140px; line-height: 1.3; text-align: center; }
.rep td.cell { text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.rep td.cell.miss { color: var(--muted); font-weight: 400; }
.rep td.cell.g5, .rep td.cell.g4 { color: var(--good); }
.rep td.cell.g2 { color: var(--qizil); }
.creds { border: 2px solid var(--sun); background: color-mix(in srgb, var(--marker) 45%, var(--sheet)); }
.creds code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { background: var(--sheet); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.kpi b { display: block; font-family: var(--display); font-size: 28px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 13px; color: var(--muted); }

.sub-list { display: flex; flex-direction: column; gap: 8px; }
.sub-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--sheet); cursor: pointer; text-align: left; width: 100%; color: inherit; }

.sub-row[aria-current="true"] { border-color: var(--siyoh); box-shadow: 0 0 0 3px var(--siyoh-soft); }
.sub-row b { display: block; font-size: 15px; }
.sub-row small { display: block; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.viewer { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--paper); }
.viewer img { display: block; width: 100%; height: auto; max-height: 560px; object-fit: contain; background: var(--paper); }
.pdf-link { display: flex; align-items: center; gap: 12px; padding: 14px; text-decoration: none; color: inherit; }
.pdf-link svg { width: 40px; height: 48px; flex: none; }
.pdf-link b { display: block; }
.grades { display: flex; gap: 8px; }
.gbtn { width: 52px; height: 52px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--sheet); cursor: pointer; font-family: var(--hand); font-weight: 700; font-size: 28px; color: var(--qizil); }
.gbtn[aria-pressed="true"] { border-color: var(--qizil); background: var(--bad-soft); }
.qres { display: flex; flex-direction: column; gap: 8px; }
.qres li { list-style: none; padding: 10px 12px; border-radius: 10px; border-left: 3px solid var(--line); background: var(--paper); font-size: 14px; }
.qres li.y { border-left-color: var(--good); }
.qres li.n { border-left-color: var(--qizil); }

.result-band { display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: 16px; background: var(--good-soft); }
.result-band .big { font-family: var(--display); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }

.back { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; text-decoration: none; background: none; border: none; color: var(--siyoh); cursor: pointer; padding: 0; }

.notebook {

  background-size: var(--cell) var(--cell);
  border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
  --margin: 92px;
}
.notebook::before { content: ""; position: absolute; top: 0; bottom: 0; left: var(--margin); width: 2px; background: var(--qizil); opacity: 0.45; pointer-events: none; }
.chat { min-height: 360px; max-height: 62vh; overflow-y: auto; padding: 22px 20px 26px 0; display: flex; flex-direction: column; gap: 22px; }
.msg.bot { display: grid; grid-template-columns: var(--margin) minmax(0, 1fr); }
.margin { display: flex; flex-direction: column; align-items: flex-end; padding: 0 10px 0 6px; gap: 2px; min-width: 0; }
.note { font-family: var(--hand); font-weight: 700; color: var(--qizil); font-size: 20px; line-height: 20px; text-align: right; max-width: calc(var(--margin) - 16px); transform: rotate(-7deg); transform-origin: right center; }
.note.sub { font-size: 17px; opacity: 0.8; transform: rotate(-4deg); }
.msg.bot .body { padding-left: 20px; line-height: 22px; max-width: 64ch; overflow-wrap: anywhere; }

.msg.me { align-self: flex-end; max-width: min(78%, 520px); margin-left: calc(var(--margin) + 20px); padding: 5px 12px; border-radius: 4px 14px 6px 12px; background: var(--marker); line-height: 22px; overflow-wrap: anywhere; }
.msg.me p + p { margin-top: 22px; }

.msg.sys { margin-left: calc(var(--margin) + 20px); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-radius: 10px; background: var(--bad-soft); font-size: 14px; }
.msg.sys p { flex: 1 1 200px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 50; max-width: min(92vw, 560px); padding: 12px 18px; border-radius: 14px; background: var(--ink); color: var(--paper); font-size: 15px; box-shadow: var(--shadow); }
.center-state { max-width: 600px; margin: 80px auto; text-align: center; color: var(--muted); }

.nowrap { white-space: nowrap; }

.pill.ai { background: var(--lilac); color: var(--siyoh); }
.tiny { font-size: 12px; }
button.pdf-link { width: 100%; background: none; border: none; text-align: left; cursor: pointer; color: inherit; font: inherit; }
.demo-box { border: 1.5px dashed var(--sun); border-radius: 14px; padding: 14px; background: color-mix(in srgb, var(--marker) 35%, var(--sheet)); display: flex; flex-direction: column; gap: 8px; }
.demo-box table { font-size: 14px; }
.demo-box td { padding: 4px 8px 4px 0; border: none; }
.demo-box code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
.two.wide-left { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); }

@media (max-width: 1080px) {
  .feats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .two, .two.wide-left { grid-template-columns: minmax(0, 1fr); }
}

  .roles { grid-template-columns: 1fr; }
  .role { padding: 22px 20px 22px 52px; }

  .feats { grid-template-columns: 1fr 1fr; }
  .steps { grid-template-columns: 1fr 1fr; }

  .auth { padding: 12px 16px 40px; }
  .auth-card { grid-template-columns: 1fr; }
  .auth-ill { padding: 16px; }
  .auth-ill svg { max-width: 240px; }
  .auth-form, .reg-card { padding: 22px; }
  .grid2, .grid3, .types { grid-template-columns: minmax(0, 1fr); }
  .dash { grid-template-columns: minmax(0, 1fr); padding: 4px 16px 40px; gap: 14px; }
  .dash-side, .dash-main { min-width: 0; }
  .wordmark { font-size: 18px; }
  .tagline { white-space: nowrap; font-size: 16px; }

  .dash-nav { flex-direction: row; overflow-x: auto; padding: 6px; }
  .nav-a { flex: none; padding: 8px 12px; font-size: 14px; }

  .notebook { --margin: 60px; }
  .note { font-size: 16px; line-height: 17px; }

  .msg.bot .body { padding-left: 14px; }
  .msg.me, .msg.sys { margin-left: calc(var(--margin) + 14px); }
  .chat { max-height: none; }
  .foot { padding: 24px 16px 32px; }
}
@media (max-width: 520px) {

  .sub-row { grid-template-columns: 40px minmax(0, 1fr); }
  .sub-row > :last-child { grid-column: 2; justify-self: start; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* files */
const isPdfFile = (f) => !!f && (f.type === "application/pdf" || /\.pdf$/i.test(f.name || ""));
const isImgFile = (f) => !!f && (/^image\//.test(f.type || "") || /\.(jpe?g|png|webp|gif|heic|heif)$/i.test(f.name || ""));
const fileUrl = (f) => (!f ? "" : f.id ? "/_blob/" + f.id : (f.data || ""));
const isImgRef = (f) => !!f && /^image\//.test(f.turi || "");
async function toJpeg(file, max, q) {
  const bmp = await createImageBitmap(file);
  const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(bmp.width * sc));
  c.height = Math.max(1, Math.round(bmp.height * sc));
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error("toBlob"))), "image/jpeg", q));
}
const blobToDataUrl = (b) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });

function assetMsg(e) {
  const c = e && e.code;
  if (c === "too_large") return "Fayl juda katta (20 MB dan oshmasin).";
  if (c === "unsupported_type") return "Bu fayl turini yuklab bo'lmaydi. Rasm (JPG, PNG) yoki PDF tanlang.";
  if (c === "quota_or_state") return "Fayllar uchun joy tugadi. Eski vazifalarni o'chiring.";
  if (c === "rate_limited") return "Juda tez yuklanmoqda. Bir oz kutib, qayta urinib ko'ring.";
  return "Faylni yuklab bo'lmadi. Qayta urinib ko'ring.";
}
async function uploadFile(file) {
  const pdf = isPdfFile(file), img = isImgFile(file);
  if (!pdf && !img) throw new Error("Faqat rasm yoki PDF fayl yuklang.");
  if (file.size > 20 * 1024 * 1024) throw new Error("Fayl 20 MB dan katta. Kichikroq fayl tanlang.");
  const nomi = (file.name || (pdf ? "fayl.pdf" : "rasm.jpg")).slice(0, 120);
  if (R.local) {
    if (pdf) {
      if (file.size > 10 * 1024 * 1024) throw new Error("Demo rejimida PDF 10 MB dan oshmasin.");
      return { data: await blobToDataUrl(file), nomi, turi: "application/pdf" };
    }
    let small;
    try { small = await toJpeg(file, 1600, 0.8); } catch (_) { throw new Error("Bu rasmni ochib bo'lmadi. JPG yoki PNG rasm tanlang."); }
    return { data: await blobToDataUrl(small), nomi, turi: "image/jpeg" };
  }
  let blob = file, type = pdf ? "application/pdf" : file.type;
  if (img && !/^image\/(jpeg|png|webp|gif)$/.test(file.type)) { blob = await toJpeg(file, 2200, 0.88); type = "image/jpeg"; }
  if (R.assets) {
    try {
      const r = await R.assets.upload(blob, { type });
      return { id: r.id, nomi, turi: type };
    } catch (e) {
      if (pdf) throw new Error(assetMsg(e));
    }
  } else if (pdf) {
    throw new Error("Bu ko'rinishda PDF yuklab bo'lmaydi. Rasm yuklang yoki sahifa egasidan fayl yuklash ruxsatini so'rang.");
  }
  // Fallback for images: a small copy kept inside the record itself.
  for (const [max, q] of [[1280, 0.72], [1000, 0.62], [800, 0.55]]) {
    const small = await toJpeg(blob, max, q);
    if (small.size <= 170000) return { data: await blobToDataUrl(small), nomi, turi: "image/jpeg" };
  }
  throw new Error("Rasm juda katta. Kichikroq yoki aniqroq kesilgan rasm tanlang.");
}

function dbMsg(e) {

  return "Saqlab bo'lmadi. Qayta urinib ko'ring.";
}

/* ---------- standalone mode: outside claude.ai the data lives in this browser ---------- */
async function makeLocalDb() {
  const store = new Map(), subs = [];
  let idb = null;
  try {
    idb = await new Promise((res, rej) => {
      const r = indexedDB.open("bilimdosti", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("docs");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    await new Promise((res) => {
      const req = idb.transaction("docs").objectStore("docs").openCursor();
      req.onsuccess = () => { const c = req.result; if (c) { store.set(String(c.key), c.value); c.continue(); } else res(); };
      req.onerror = () => res();
    });
  } catch (_) { idb = null; R.localVolatile = true; }
  const persist = (path, data) => {
    if (!idb) return;
    try { const os = idb.transaction("docs", "readwrite").objectStore("docs"); if (data === undefined) os.delete(path); else os.put(data, path); } catch (_) {}
  };
  const clone = (d) => JSON.parse(JSON.stringify(d));
  const last = (p) => p.slice(p.lastIndexOf("/") + 1);
  const parent = (p) => p.slice(0, p.lastIndexOf("/"));
  const ok = (d, fs) => fs.every(([f, op, v]) => (op === "==" ? d[f] === v : op === "in" ? Array.isArray(v) && v.includes(d[f]) : true));
  const snap = (colPath, fs) => {
    const docs = [];
    store.forEach((d, p) => { if (parent(p) === colPath && ok(d, fs)) docs.push({ id: last(p), exists: true, data: () => clone(d), metadata: { fromCache: false, hasPendingWrites: false } }); });
    return { docs, size: docs.length, empty: !docs.length, metadata: { fromCache: false, hasPendingWrites: false }, docChanges: () => [] };
  };
  let queued = false;
  const notify = () => { if (queued) return; queued = true; setTimeout(() => { queued = false; subs.slice().forEach((x) => x.next(snap(x.col, x.fs))); }, 0); };
  const docRef = (path) => ({
    id: last(path), path,
    get: async () => { const d = store.get(path); return { id: last(path), exists: !!d, data: () => (d ? clone(d) : undefined), metadata: {} }; },
    set: async (data) => { const d = clone(data); store.set(path, d); persist(path, d); notify(); },
    update: async (data) => { const cur = store.get(path); if (!cur) throw { code: "invalid_argument", message: "missing" }; const d = Object.assign(clone(cur), clone(data)); store.set(path, d); persist(path, d); notify(); },
    delete: async () => { store.delete(path); persist(path, undefined); notify(); }
  });
  const query = (colPath, fs) => ({
    where: (f, op, v) => query(colPath, fs.concat([[f, op, v]])),
    orderBy: () => query(colPath, fs),
    limit: () => query(colPath, fs),
    get: async () => snap(colPath, fs),
    onSnapshot: (next) => { const x = { col: colPath, fs, next }; subs.push(x); setTimeout(() => next(snap(colPath, fs)), 0); return () => { const i = subs.indexOf(x); if (i >= 0) subs.splice(i, 1); }; }
  });
  return {
    doc: docRef,
    collection: (colPath) => Object.assign(query(colPath, []), { path: colPath, doc: (id) => docRef(colPath + "/" + (id || "l" + rid(8))) }),
    clearAll: async () => { store.clear(); if (idb) { try { idb.transaction("docs", "readwrite").objectStore("docs").clear(); } catch (_) {} } notify(); }
  };
}

function stopSubs() { R.unsubs.forEach((u) => { try { u(); } catch (_) {} }); R.unsubs = []; R.loaded = {}; R.slow = false; R.dbErr = false; }
function listen(q, key) {
  R.loaded[key] = false;
  let t = setTimeout(() => { t = 0; if (!R.loaded[key]) { R.slow = true; render(); } }, 10000);
  let un = null;
  try {
    un = q.onSnapshot((snap) => {
      if (t) { clearTimeout(t); t = 0; }
      R[key] = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      R.loaded[key] = true; R.slow = false;
      render();
    }, () => { if (t) { clearTimeout(t); t = 0; } R.loaded[key] = true; R.dbErr = true; render(); });
  } catch (_) { R.loaded[key] = true; R.dbErr = true; }
  R.unsubs.push(() => { if (t) clearTimeout(t); if (un) un(); });
}
function subscribeTeacher(t) {
  listen(col("tasks").where("teacherId", "==", t.id), "tasks");
  listen(col("submissions").where("teacherId", "==", t.id), "subs");
  const keys = (t.classKeys || []).slice(0, 30);
  if (keys.length) listen(col("students").where("classKey", "in", keys), "students");
  else { R.students = []; R.loaded.students = true; }

function subscribeStudent(st) {
  listen(col("tasks").where("classKey", "==", st.classKey), "tasks");
  listen(col("submissions").where("studentId", "==", st.id), "subs");
}

async function createStudents(list) {
  const t = R.me, taken = new Set(), out = [];
  try {
    for (const s of list) {
      let login = (s.login || "").trim().toLowerCase();
      if (login) {
        if (!validLogin(login)) throw new Error(`"${login}" login noto'g'ri: lotin harflari, raqam, nuqta yoki chiziqcha bo'lsin.`);
        if (taken.has(login) || (await getDoc("logins/" + login))) throw new Error(`"${login}" login band. Boshqasini yozing yoki bo'sh qoldiring.`);
      } else {
        const base = baseLogin(s.ism, s.familiya);
        login = base;
        let n = 1;
        while (taken.has(login) || (await getDoc("logins/" + login))) { n++; login = base + n; }
      }
      taken.add(login);
      const parol = (s.parol || "").trim() || genPass();
      const salt = rid(12);
      const hash = await hashPass(parol, salt);
      const id = col("students").doc().id;
      await R.db.doc("students/" + id).set({
        teacherId: t.id, login, salt, hash, ism: s.ism, familiya: s.familiya, sinf: s.sinf,
        schoolKey: t.schoolKey, classKey: t.schoolKey + "|" + s.sinf,
        maktab: t.maktab, tuman: t.tuman, viloyat: t.viloyat, yaratilgan: Date.now()
      });
      await R.db.doc("logins/" + login).set({ role: "student", ref: id });
      out.push({ ism: s.ism, familiya: s.familiya, sinf: s.sinf, login, parol });
    }
  } catch (err) { err.partial = out; throw err; }
  return out;
}

function reportModel(sinf, fan) {
  const tasks = R.tasks.filter((t) => t.sinf === sinf && (fan === "all" || t.fan === fan)).sort((a, b) => (a.yaratilgan || 0) - (b.yaratilgan || 0));

    const cells = tasks.map((t) => map.get(t.id + "__" + st.id) || null);

    const tests = cells.filter((s) => s && s.jami).map((s) => s.ball / s.jami);

      st, cells, done: cells.filter(Boolean).length,
      avg: bahos.length ? bahos.reduce((a, b) => a + b, 0) / bahos.length : null,
      testPct: tests.length ? Math.round((tests.reduce((a, b) => a + b, 0) / tests.length) * 100) : null
    };
  });
  return { tasks, rows };
}

function aiRules(sinf, fan) {
  return [
    `Sen "Bilim do'sti"san: O'zbekistondagi ${sinf}-sinf o'quvchisiga ${fan} fanidan yordam beradigan mehribon va sabrli ustoz.`,
    "Qoidalar:",

    "- Hech qachon yakuniy javobni yoki to'liq yechimni aytma. O'quvchi javobni o'zi topishi kerak. Test variantlaridan qaysi biri to'g'ri ekanini ham aytma.",
    "- Yechimni 2-5 ta qadamga bo'l. Har safar faqat bitta qadamni tushuntir va shu qadam bo'yicha bitta aniq savol ber.",
    "- O'quvchi javobi to'g'ri bo'lsa, qisqa maqta, keyingi qadamni tushuntir va yangi savol ber.",
    "- Javob noto'g'ri bo'lsa, xatoni yumshoq ko'rsat, soddaroq misol yoki ishora bilan maslahat ber va yana so'ra. Javobni baribir aytma.",
    "- O'quvchi javobni aytib berishni so'rasa ham aytma: kichikroq ishora ber.",
    "- O'quvchi oxirgi qadamni to'g'ri bajarsa, masala yechildi: tabrikla va nimani o'rganganini bir jumlada ayt.",
    "- Formulalarni oddiy matnda yoz: x², √, ×, ÷, 3/4. LaTeX ishlatma. Muhim so'zni **qalin** qilishing mumkin.",
    "- Xabar maktab darsiga aloqasi bo'lmasa yoki noo'rin bo'lsa, muloyimlik bilan rad et.",
    "",
    "Har safar FAQAT bitta JSON obyekt qaytar, kalitlar shu tartibda:",
    `{"holat": "savol" | "togri" | "xato" | "yechildi" | "rad", "qadam": joriy qadam raqami, "jami_qadam": jami qadamlar soni, "matn": "o'quvchiga xabar"}`,
    "holat ma'nosi: savol = yangi qadamni tushuntirib savol berding yoki o'quvchining savoliga javob berding; togri = javob to'g'ri va keyingi qadam savolini berding; xato = javob noto'g'ri, maslahat berib qayta so'rading; yechildi = masala to'liq yechildi; rad = xabar maktab masalasi emas yoki rasmni o'qib bo'lmadi."
  ].join("\n");
}
function aiFirst(sinf, fan, text, hasImg) {
  return aiRules(sinf, fan) + "\n\nBu YANGI masala. Avval masalani o'qi" +
    (hasImg ? " (masala rasmda: rasmni diqqat bilan o'qi; o'qib bo'lmasa, holat \"rad\" bo'lsin va aniqroq rasm so'ra)" : "") +
    ". Vazifada bir nechta masala bo'lsa, o'quvchidan qaysi biridan boshlashni so'ra. JSON'ga matn'dan oldin yana ikki kalit qo'sh: \"masala\" = masalaning to'liq matni, \"mavzu\" = 2-4 so'zli mavzu nomi. Birinchi javobingda holat \"savol\", qadam 1 bo'lsin.\n\nO'quvchi xabari:\n" + (text || "(Matn yo'q, masala rasmda.)");
}
const aiContext = (p) => aiRules(p.sinf, p.fan) + "\n\nMasala: " + p.masala + "\nMavzu: " + (p.mavzu || "aniqlanmagan") + "\n\nSen bu masalani o'quvchi bilan qadamma-qadam yechyapsan. Suhbat quyida davom etadi. Har bir javobing yuqoridagi JSON shaklida bo'lsin.";
const clampInt = (v, lo, hi, d) => { const n = Math.round(Number(v)); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : d; };
function readReply(v) {
  if (!v || typeof v !== "object") throw { code: "invalid_json" };
  const holat = ["savol", "togri", "xato", "yechildi", "rad"].includes(v.holat) ? v.holat : "savol";
  const matn = typeof v.matn === "string" ? v.matn.trim() : "";
  if (!matn) throw { code: "invalid_json" };
  const qadam = clampInt(v.qadam, 1, 12, 1);
  return { holat, matn, qadam, jami: Math.max(clampInt(v.jami_qadam, 1, 12, Math.max(qadam, 3)), qadam), masala: typeof v.masala === "string" ? v.masala.trim().slice(0, 1200) : "", mavzu: typeof v.mavzu === "string" ? v.mavzu.trim().slice(0, 60) : "" };
}
const replyJson = (r) => JSON.stringify({ holat: r.holat, qadam: r.qadam, jami_qadam: r.jami, matn: r.matn });
function botMsg(r) {
  let tag = r.qadam + "-qadam", sub = "";
  if (r.holat === "togri") { tag = "to'g'ri ✓"; sub = r.qadam + "-qadam"; }
  else if (r.holat === "xato") { tag = "maslahat"; sub = r.qadam + "-qadam"; }
  else if (r.holat === "yechildi") tag = "yechildi!";
  else if (r.holat === "rad") tag = "hmm";
  return { id: rid(), who: "bot", tag, sub, text: r.matn };
}
function partialMatn(raw) {
  const i = raw.indexOf('"matn"'); if (i < 0) return "";
  const colon = raw.indexOf(":", i + 6); if (colon < 0) return "";
  const q = raw.indexOf('"', colon + 1); if (q < 0) return "";
  let out = "", k = q + 1;
  while (k < raw.length) {
    const ch = raw[k];
    if (ch === "\\") {
      const n = raw[k + 1];
      if (n === undefined) break;
      if (n === "n") out += "\n";
      else if (n === "u") { const hex = raw.substr(k + 2, 4); if (hex.length < 4) break; out += String.fromCharCode(parseInt(hex, 16)); k += 6; continue; }
      else if (n !== "t") out += n;
      k += 2; continue;
    }
    if (ch === '"') break;
    out += ch; k++;
  }
  return out;
}
const AI_HARD = new Set(["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed", "no_sample"]);
function aiCopy(code) {
  if (AI_HARD.has(code)) return code === "no_sample" ? "AI yordamchi faqat claude.ai ichida ishlaydi." : "AI'dan foydalanishga ruxsat berilmadi. Sahifani qayta ochib, so'ralganda ruxsat bering.";
  if (code === "rate_limited") return "So'rovlar juda ko'p bo'ldi. Bir oz kutib, qayta urinib ko'ring.";
  if (code === "image_rejected") return "Bu rasmni ochib bo'lmadi. JPG yoki PNG rasm tanlang.";
  if (code === "refused") return "Bu xabarga javob bera olmayman. Maktab masalasini yuboring.";
  if (code === "prompt_too_large") return "Suhbat juda uzun bo'lib ketdi. Yangi masala boshlang.";
  if (code === "cancelled") return "To'xtatildi.";
  return "Javob olishda xatolik bo'ldi. Qayta urinib ko'ring.";
}
async function aiAsk(input, images) {
  const sample = R.sample !== undefined ? R.sample : await R.samplePromise;
  if (!sample) throw { code: "no_sample" };
  const ctl = new AbortController();
  R.aiCtl = ctl; R.aiBusy = true; R.aiStream = ""; render();
  try {
    const o = { signal: ctl.signal, cache: false };
    if (images && images.length) o.images = images;
    o.onText = ({ text }) => {
      const t = partialMatn(text);
      if (!t || t === R.aiStream) return;
      R.aiStream = t;
      const el = document.getElementById("ai-stream");
      if (el) { el.innerHTML = fmt(t); scrollAi(); }
    };
    return await sample.json(input, o);
  } finally { R.aiBusy = false; R.aiCtl = null; R.aiStream = ""; }
}
async function aiSend(textArg, imgArg) {
  if (R.aiBusy || !R.me) return;
  const A = S.ai, fromArg = typeof textArg === "string";
  const text = (fromArg ? textArg : A.input).trim();
  let img = fromArg ? imgArg || null : R.files.ai;
  if (!text && !img) return;
  if (!fromArg) { A.input = ""; if (img) setFile("ai", null); }
  if (img && !/^image\/(jpeg|png|webp|gif)$/.test(img.type || "")) { try { img = await toJpeg(img, 2000, 0.88); } catch (_) { toast(aiCopy("image_rejected")); return; } }
  R.aiRetry = null;
  A.log.forEach((m) => { if (m.who === "sys") m.retry = false; });
  const msg = { id: rid(), who: "me", text, img: !!img };
  if (img) R.aiImg.set(msg.id, URL.createObjectURL(img));
  A.log.push(msg);
  const p0 = A.p;
  if (!p0 || p0.yechildi || p0.rad || !p0.turns.length) {
    A.p = { masala: text, mavzu: "", qadam: 0, jami: 0, turns: [], yechildi: false, rad: false, sinf: sinfNum(R.me.sinf) || 7, fan: A.fan || "Matematika" };
  } else {
    A.p.turns.push({ role: "user", content: text || "(O'quvchi o'z yechimining rasmini yubordi. Rasmni o'qib, tekshir.)" });
    if (A.p.turns.length > 24) A.p.turns = A.p.turns.slice(0, 2).concat(A.p.turns.slice(-20));
  }
  const P = A.p;
  const run = async () => {
    try {
      if (!P.turns.length) {
        const v = await aiAsk(aiFirst(P.sinf, P.fan, text, !!img), img ? [img] : null);
        if (S.ai !== A || A.p !== P) return;
        const r = readReply(v);
        if (r.holat === "rad") { P.rad = true; A.log.push(botMsg(r)); return; }
        P.masala = r.masala || text || "Rasmdagi masala"; P.mavzu = r.mavzu; P.qadam = r.qadam; P.jami = r.jami;
        P.turns = [{ role: "user", content: aiContext(P) }, { role: "assistant", content: replyJson(r) }];
        A.log.push(botMsg(r));
      } else {
        const v = await aiAsk(P.turns, img ? [img] : null);
        if (S.ai !== A || A.p !== P) return;
        const r = readReply(v);
        P.qadam = r.qadam; P.jami = Math.max(P.jami, r.jami);
        P.turns.push({ role: "assistant", content: replyJson(r) });
        A.log.push(botMsg(r));
        if (r.holat === "yechildi") P.yechildi = true;
      }
    } catch (e) {
      if (S.ai !== A) return;
      const code = (e && e.code) || "upstream_error";
      if (AI_HARD.has(code)) R.aiOff = true;
      const canRetry = !AI_HARD.has(code) && code !== "refused" && code !== "prompt_too_large";
      A.log.push({ id: rid(), who: "sys", text: aiCopy(code), retry: canRetry });
      R.aiRetry = canRetry ? async () => { R.aiRetry = null; A.log.forEach((m) => { if (m.who === "sys") m.retry = false; }); await run(); } : null;
    } finally { render(); }
  };
  await run();
}

function loadScript(src) {
  return new Promise((res, rej) => { const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = () => rej(new Error("script")); document.head.appendChild(el); });
}
let pdfjsPromise = null;
function loadPdfJs() {
  if (!pdfjsPromise) {
    const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
    pdfjsPromise = Promise.race([
      (async () => {
        // The worker build, loaded as a plain script, lets pdf.js read PDFs on the page itself.
        await loadScript(base + "pdf.worker.min.js");
        await loadScript(base + "pdf.min.js");
        const lib = window.pdfjsLib || window["pdfjs-dist/build/pdf"];
        if (!lib) throw new Error("pdfjs");
        lib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js";
        return lib;
      })(),
      new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 20000))
    ]);
    pdfjsPromise.catch(() => { pdfjsPromise = null; });
  }
  return pdfjsPromise;
}
async function pdfToImages(blob, maxPages) {
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()), isEvalSupported: false }).promise;
  const out = [];
  for (let i = 1; i <= Math.min(doc.numPages, maxPages); i++) {
    const page = await doc.getPage(i);
    const v1 = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: Math.min(2, 1600 / Math.max(v1.width, v1.height)) });
    const c = document.createElement("canvas");
    c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    out.push(await new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error("toBlob"))), "image/jpeg", 0.85)));
  }
  try { doc.destroy(); } catch (_) {}
  return out;
}
async function fileToImages(f, maxPages) {
  if (!f) return [];
  const res = await fetch(fileUrl(f));
  if (!res.ok) throw new Error("fetch");
  const blob = await res.blob();
  if (/pdf/i.test(f.turi || "") || blob.type === "application/pdf") return await pdfToImages(blob, maxPages);
  return [await toJpeg(blob, 2000, 0.85)];
}
function aiCheckPrompt(task, s, nTask, nAns) {

    "- Taklif qilinadigan baho 5 ballik tizimda: 5 = hammasi to'g'ri; 4 = kichik xatolar; 3 = taxminan yarmi to'g'ri; 2 = asosan noto'g'ri yoki bajarilmagan.",

const clip = (v, n) => (typeof v === "string" ? v.trim().slice(0, n) : "");
function readCheck(v) {
  if (!v || typeof v !== "object") throw { code: "invalid_json" };
  const holat = ["togri", "qisman", "notogri", "aniqlanmadi"].includes(v.holat) ? v.holat : "aniqlanmadi";
  const jami = clampInt(v.jami, 0, 99, 0);
  const baho = [2, 3, 4, 5].includes(Number(v.taklif_baho)) ? Number(v.taklif_baho) : null;
  return {
    holat, jami, togri: Math.min(jami, clampInt(v.togri_soni, 0, 99, 0)),
    baho: holat === "aniqlanmadi" ? null : baho,
    xulosa: clip(v.xulosa, 600), oquvchiga: clip(v.oquvchiga, 300),
    xatolar: Array.isArray(v.xatolar) ? v.xatolar.map((x) => clip(x, 240)).filter(Boolean).slice(0, 8) : []
  };
}
function aiCheckCopy(code) {
  if (code === "answer_unreadable") return "O'quvchi javobini AI o'qiy olmadi (rasm yoki PDF ochilmadi). Javobni ko'zdan kechirib, o'zingiz baholang.";
  if (code === "no_answer") return "Bu javobda tekshiriladigan rasm yoki PDF yo'q.";
  if (code === "images_unavailable") return "Bu ko'rinishda AI'ga rasm yuborib bo'lmaydi.";
  if (code === "invalid_json" || code === "empty_completion") return "AI tushunarli javob qaytarmadi. Qayta tekshirib ko'ring.";
  return aiCopy(code);
}
async function checkOne(subId, signal) {
  const s = R.subs.find((x) => x.id === subId);
  if (!s || s.turi === "test") return;
  if (!s.fayl) throw { code: "no_answer" };
  const task = R.tasks.find((t) => t.id === s.taskId);
  const sample = R.sample !== undefined ? R.sample : await R.samplePromise;
  if (!sample) throw { code: "no_sample" };
  const lim = await sample.limits().catch(() => null);
  if (!lim || !lim.images) throw { code: "images_unavailable" };
  const maxN = Math.max(1, Math.min(lim.images.maxCount || 4, 6));
  const notes = [];
  let ansImgs;
  try { ansImgs = await fileToImages(s.fayl, 3); } catch (_) { throw { code: "answer_unreadable" }; }
  if (!ansImgs.length) throw { code: "answer_unreadable" };
  ansImgs = ansImgs.slice(0, maxN);
  let taskImgs = [];
  if (task && task.fayl && maxN > ansImgs.length) {
    try { taskImgs = (await fileToImages(task.fayl, 2)).slice(0, maxN - ansImgs.length); }
    catch (_) { notes.push("Vazifa faylini AI o'qiy olmadi: tekshiruv faqat vazifa matni va o'quvchi javobiga qarab qilindi."); }
  }
  if (signal.aborted) throw { code: "cancelled" };
  const v = await sample.json(aiCheckPrompt(task, s, taskImgs.length, ansImgs.length), { images: taskImgs.concat(ansImgs), signal, cache: false });
  const ai = Object.assign(readCheck(v), { izohlar: notes, vaqt: Date.now() });
  await R.db.doc("submissions/" + subId).update({ ai });
}
async function checkMany(ids) {
  if (R.chk.busy || !ids.length) return;
  const ctl = new AbortController();
  R.chk = { busy: true, ctl, queue: ids.slice(), done: 0, current: null };
  ids.forEach((id) => { delete R.chkErr[id]; });
  render();
  let ok = 0, stopMsg = "";
  for (const id of ids) {
    if (ctl.signal.aborted) break;
    R.chk.current = id; render();
    try { await checkOne(id, ctl.signal); ok++; }
    catch (e) {
      const code = (e && e.code) || "upstream_error";
      if (code === "cancelled") break;
      R.chkErr[id] = aiCheckCopy(code);
      if (AI_HARD.has(code) || code === "rate_limited" || code === "images_unavailable") { stopMsg = aiCheckCopy(code); break; }
    }
    R.chk.done++;
  }
  const stopped = ctl.signal.aborted;
  R.chk = { busy: false, ctl: null, queue: [], done: 0, current: null };
  render();
  if (stopMsg) toast(stopMsg);
  else if (stopped) toast("AI tekshiruvi to'xtatildi.");
  else if (ids.length > 1) toast(`AI ${ok} ta javobni tekshirdi. Natijalarni ko'rib, baho qo'ying.`);
  else if (ok) toast("AI tekshirdi. Natijani ko'rib, bahoni o'zingiz qo'ying.");
}

function tHisobot() {
  const me = R.me, f = S.forms.rep;
  if (!me.sinflar.includes(f.sinf)) f.sinf = me.sinflar[0] || "";
  const m = reportModel(f.sinf, f.fan);
  const nSt = m.rows.length, nT = m.tasks.length;
  const done = m.rows.reduce((a, r) => a + r.done, 0);
  const bahos = [];
  m.rows.forEach((r) => r.cells.forEach((s) => { if (s && s.baho) bahos.push(Number(s.baho)); }));
  const rate = nSt && nT ? Math.round((done / (nSt * nT)) * 100) : 0;
  const head = `<header class="sec-h"><div><h1>Hisobotlar</h1><p>Sinf va fan bo'yicha natijalar. Excel'da ochiladigan faylni yuklab olishingiz mumkin.</p></div>
    <div class="row">${selectField("Sinf", "rep-sinf", "forms.rep.sinf", me.sinflar.map((s) => [s, s + " sinf"]), { rerender: true })}${selectField("Fan", "rep-fan", "forms.rep.fan", [["all", "Barcha fanlar"], ...me.fanlar.map((x) => [x, x])], { rerender: true })}</div></header>`;
  if (!R.loaded.tasks || !R.loaded.students || !R.loaded.subs) return head + loadingBox();
  const kpis = `<div class="kpis"><div class="kpi"><b>${nSt}</b><span>o'quvchi</span></div><div class="kpi"><b>${nT}</b><span>vazifa</span></div><div class="kpi"><b>${rate}%</b><span>topshirilgan</span></div><div class="kpi"><b>${bahos.length ? one(bahos.reduce((a, b) => a + b, 0) / bahos.length) : "—"}</b><span>o'rtacha baho</span></div></div>`;
  if (!nSt || !nT) return head + kpis + emptyBox(!nSt ? "Bu sinfda o'quvchi yo'q" : "Bu sinf va fan bo'yicha vazifa yo'q", "Hisobot o'quvchilar va vazifalar bo'lganda tuziladi.");
  const table = `<div class="table-wrap rep"><table><thead><tr><th class="num">№</th><th>O'quvchi</th>${m.tasks.map((t) => `<th class="task" title="${esc(t.fan + ": " + t.sarlavha)}">${esc(t.sarlavha)}<br><span class="muted">${esc(t.fan)} · ${dayOnly(t.yaratilgan)}</span></th>`).join("")}<th class="num">Topshirgan</th><th class="num">O'rtacha baho</th><th class="num">Test, %</th></tr></thead><tbody>${m.rows.map((r, i) => `<tr><td class="num">${i + 1}</td><td><b>${esc(fullName(r.st))}</b></td>${r.cells.map((s) => `<td class="cell${!s ? " miss" : s.baho ? " g" + esc(s.baho) : ""}">${esc(cellText(s))}</td>`).join("")}<td class="num">${r.done}/${nT}</td><td class="num"><b>${r.avg == null ? "—" : one(r.avg)}</b></td><td class="num">${r.testPct == null ? "—" : r.testPct}</td></tr>`).join("")}</tbody></table></div>
    <p class="muted small">Belgilar: raqam = qo'yilgan baho, 8/10 = test balli, ✓ = topshirgan, baholanmagan, — = topshirmagan.</p>`;
  return head + kpis + table + `<div class="row"><button type="button" class="btn" data-act="rep-dl" id="rep-dl">Hisobotni yuklab olish (Excel, CSV)</button></div>`;
}

function stuPill(t, s) {
  if (s) {
    if (s.baho) return `<span class="pill ok">Baho: ${esc(s.baho)}</span>`;
    if (s.jami) return `<span class="pill ok">Test: ${esc(s.ball)}/${esc(s.jami)}</span>`;
    return `<span class="pill wait">Tekshirilmoqda</span>`;
  }
  if (t.muddat && Date.now() > new Date(t.muddat + "T23:59:59").getTime()) return `<span class="pill late">Muddati o'tgan</span>`;
  return `<span class="pill new">Yangi</span>`;
}
function sVazifalar() {
  if (S.openTask) { const t = R.tasks.find((x) => x.id === S.openTask); if (t) return taskDetail(t); S.openTask = null; }
  const head = `<header class="sec-h"><div><h1>Vazifalar</h1><p>Qaysi fandan vazifa kelganini shu yerda ko'rasiz.</p></div></header>`;
  if (!R.loaded.tasks) return head + loadingBox();
  const tasks = R.tasks.slice().sort((a, b) => (b.yaratilgan || 0) - (a.yaratilgan || 0));
  if (!tasks.length) return head + emptyBox("Hozircha vazifa yo'q", "O'qituvchingiz vazifa yuborishi bilan u shu yerda paydo bo'ladi.");
  const fans = [...new Set(tasks.map((t) => t.fan))];
  if (S.stuFan !== "all" && !fans.includes(S.stuFan)) S.stuFan = "all";
  const freshIn = (fan) => tasks.filter((t) => (fan === "all" || t.fan === fan) && !mySub(t.id)).length;
  const chips = `<div class="chips" role="group" aria-label="Fan bo'yicha">${[["all", "Barcha fanlar"], ...fans.map((x) => [x, x])].map(([v, l], i) => { const n = freshIn(v); return `<button type="button" class="chip" data-act="stu-fan" data-v="${esc(v)}" id="sf-${i}" aria-pressed="${S.stuFan === v}">${esc(l)}${n ? ` <span class="cnt">${n} yangi</span>` : ""}</button>`; }).join("")}</div>`;
  const list = tasks.filter((t) => S.stuFan === "all" || t.fan === S.stuFan).map((t) => {
    const s = mySub(t.id);
    return `<button type="button" class="tcard click" data-act="open-task" data-v="${esc(t.id)}" id="t-${esc(t.id)}">
      <span class="tcard-top"><span class="${fanCls(t.fan)}">${esc(t.fan)}</span>${typeBadge(t)}<span class="tcard-right">${stuPill(t, s)}</span></span>

    </button>`;
  }).join("");
  return head + chips + `<div class="tcards">${list}</div>`;
}

function testBlock(t, s) {

      ${qs.map((q, i) => `<div class="test-q"><h3><span>${i + 1}.</span>${esc(q.savol)}</h3>${q.v.map((v, j) => {
        const mine = Array.isArray(s.javoblar) && s.javoblar[i] === j, right = q.togri === j;

    ${errBox("test")}
    <div class="row between"><span class="muted">Javob berildi: ${answered} / ${qs.length}</span><button type="button" class="btn big" data-act="submit-test" data-v="${esc(t.id)}" id="submit-test"${w ? " disabled" : ""}>${w ? "Yuborilmoqda..." : "Testni topshirish"}</button></div>`;

function sNatijalar() {

}

/* ---------- render ---------- */
const T_ROUTES = ["oqituvchi-vazifa", "oqituvchi-javoblar", "oqituvchi-sinflar", "oqituvchi-hisobot", "oqituvchi-profil"];
const O_ROUTES = ["oquvchi-vazifalar", "oquvchi-natijalar", "oquvchi-yordamchi"];
const ALL_ROUTES = ["bosh", "kirish", "royxat", ...T_ROUTES, ...O_ROUTES];
function view() {
  const r = S.route;
  if (T_ROUTES.includes(r)) return S.session && S.session.role === "teacher" && R.me ? vTeacher(r) : vNeedLogin("teacher");
  if (O_ROUTES.includes(r)) return S.session && S.session.role === "student" && R.me ? vStudent(r) : vNeedLogin("student");
  if (r === "kirish") return S.session && R.me ? vLanding() : vLogin();
  if (r === "royxat") return vRegister();
  return vLanding();
}
function render() {
  const a = document.activeElement;
  const id = a && a !== document.body && a.id ? a.id : null;
  let ss = null, se = null;
  try { if (a && typeof a.selectionStart === "number") { ss = a.selectionStart; se = a.selectionEnd; } } catch (_) {}
  R.fileReg.clear();
  $("#top").innerHTML = vHeader();
  $("#app").innerHTML = view();
  if (id) {
    const el = document.getElementById(id);
    if (el && el !== document.activeElement) {
      try { el.focus({ preventScroll: true }); } catch (_) {}
      if (ss != null && typeof el.setSelectionRange === "function") { try { el.setSelectionRange(ss, se); } catch (_) {} }
    }
  }
  if (S.route === "oquvchi-yordamchi") scrollAi();
}
function onHash() {
  const h = (location.hash || "").slice(1);
  const next = ALL_ROUTES.includes(h) ? h : "bosh";
  if (next !== S.route) { S.openTask = null; S.confirm = null; S.reAns = null; S.err = {}; }
  S.route = next;
  render();
  window.scrollTo(0, 0);
}

/* ---------- events ---------- */
function onClick(e) {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const v = t.dataset.v;
  switch (t.dataset.act) {
    case "logout": logout(); break;
    case "toggle-fan": {
      const list = getPath(S, `forms.${t.dataset.scope}.fanlar`);
      const i = list.indexOf(v);
      if (i >= 0) list.splice(i, 1); else list.push(v);
      render(); break;
    }
    case "task-type": S.forms.task.turi = v; render(); break;
    case "add-q": S.forms.task.savollar.push(freshQ()); render(); { const n = S.forms.task.savollar.length - 1; const el = document.getElementById("q-" + n); if (el) el.focus(); } break;
    case "del-q": S.forms.task.savollar.splice(Number(v), 1); render(); break;
    case "clear-file": setFile(v, null); render(); break;
    case "task-subs": S.forms.inbox = { sinf: "all", fan: "all", holat: "all", task: v }; S.openSub = null; go("oqituvchi-javoblar"); break;
    case "del-task": S.confirm = { kind: "task", id: v }; render(); break;
    case "del-task-yes": delTask(v); break;
    case "confirm-no": S.confirm = null; render(); break;
    case "open-sub": S.openSub = v; S.err.grade = ""; render(); { const d = document.getElementById("sub-detail"); if (d && window.innerWidth < 1080) d.scrollIntoView({ block: "start" }); } break;
    case "close-sub": S.openSub = null; render(); break;
    case "grade": if (S.openSub && S.grade[S.openSub]) { S.grade[S.openSub].baho = Number(v); render(); } break;
    case "save-grade": saveGrade(v); break;
    case "sinf-tab": S.sinfTab = v; S.forms.one.sinf = v; S.forms.bulk.sinf = v; S.confirm = null; render(); break;
    case "reset-pass": resetPass(v); break;
    case "del-st": S.confirm = { kind: "student", id: v }; render(); break;
    case "del-st-yes": delStudent(v); break;
    case "creds-dl": if (R.creds) offerDownload(safeName(`loginlar_${R.creds[0].sinf}.csv`), credsCsv(R.creds)); break;
    case "creds-copy": if (R.creds) copyText(credsText(R.creds), "Login va parollar nusxalandi."); break;
    case "creds-close": R.creds = null; render(); break;
    case "rep-dl": { const f = S.forms.rep; offerDownload(safeName(`hisobot_${f.sinf}_${f.fan === "all" ? "barcha-fanlar" : f.fan}.csv`), reportCsv(reportModel(f.sinf, f.fan))); break; }
    case "stu-fan": S.stuFan = v; render(); break;
    case "open-task": S.openTask = v; S.err = {}; S.reAns = null; setFile("ans", null); render(); window.scrollTo(0, 0); break;
    case "close-task": S.openTask = null; render(); break;
    case "pick": { const tid = t.dataset.t; const a = S.testAns[tid] || (S.testAns[tid] = []); a[Number(t.dataset.q)] = Number(t.dataset.o); render(); break; }
    case "submit-test": submitTest(v); break;
    case "submit-ans": submitPhoto(v); break;
    case "re-ans": S.reAns = v; render(); break;
    case "re-ans-cancel": S.reAns = null; setFile("ans", null); render(); break;
    case "ask-ai": { const task = R.tasks.find((x) => x.id === v); if (task) aiFromTask(task); break; }
    case "ai-new": if (R.aiCtl) R.aiCtl.abort(); { const fan = S.ai.fan; S.ai = freshAi(); S.ai.fan = fan; } R.aiRetry = null; render(); break;
    case "ai-stop": if (R.aiCtl) R.aiCtl.abort(); break;
    case "ai-retry": if (R.aiRetry && !R.aiBusy) R.aiRetry(); break;
    case "open-file": { const f = R.fileReg.get(v); if (f) openDataFile(f); break; }
    case "ai-check": if (aiCanCheck()) checkMany([v]); break;
    case "ai-check-all": if (aiCanCheck()) checkMany(R.subs.filter((s) => (R.inboxIds || []).includes(s.id) && needsCheck(s)).map((s) => s.id)); break;
    case "ai-check-stop": if (R.chk.ctl) R.chk.ctl.abort(); break;
    case "ai-apply": {
      const sub = R.subs.find((x) => x.id === v);
      if (sub && sub.ai && sub.ai.baho) {
        if (!S.grade[v]) S.grade[v] = { baho: 0, izoh: "" };
        S.grade[v].baho = sub.ai.baho;
        if (!S.grade[v].izoh && sub.ai.oquvchiga) S.grade[v].izoh = sub.ai.oquvchiga;
        render();
        toast("AI taklifi qo'llandi. Tekshirib, \"Bahoni saqlash\" tugmasini bosing.");
      }
      break;
    }
    case "seed-demo": seedDemo(); break;
    case "clear-ask": S.confirm = { kind: "clear" }; render(); break;
    case "clear-yes": clearAllLocal(); break;
  }
}
function autosize(el) { el.style.height = "auto"; el.style.height = Math.min(140, el.scrollHeight + 2) + "px"; }
function bindEvents() {
  document.addEventListener("click", onClick);
  document.addEventListener("input", (e) => {
    const el = e.target;
    if (el.dataset && el.dataset.bind && el.tagName !== "SELECT") { setPath(S, el.dataset.bind, el.value); if (el.id === "ai-input") autosize(el); }
  });
  document.addEventListener("change", (e) => {
    const el = e.target;
    if (!el.dataset) return;
    if (el.tagName === "SELECT" && el.dataset.bind) { setPath(S, el.dataset.bind, el.value); if (el.dataset.rerender) render(); }
    else if (el.dataset.radio) setPath(S, el.dataset.radio, Number(el.value));
    else if (el.dataset.file) { const f = el.files && el.files[0]; el.value = ""; if (f) pickFile(el.dataset.file, f); }
  });
  document.addEventListener("submit", (e) => {
    const k = e.target.dataset && e.target.dataset.form;
    if (!k) return;
    e.preventDefault();
    const fn = { login: doLogin, reg: doRegister, task: sendTask, one: addOne, bulk: addBulk, prof: saveProfile, pass: changePass, ai: () => aiSend() }[k];
    if (fn) fn();
  });
  document.addEventListener("keydown", (e) => {
    if (e.target && e.target.id === "ai-input" && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); aiSend(); }
  });
  document.addEventListener("dragover", (e) => { const d = e.target.closest && e.target.closest("[data-drop]"); if (d) { e.preventDefault(); d.classList.add("over"); } });
  document.addEventListener("dragleave", (e) => { const d = e.target.closest && e.target.closest("[data-drop]"); if (d) d.classList.remove("over"); });
  document.addEventListener("drop", (e) => {
    const d = e.target.closest && e.target.closest("[data-drop]");
    if (!d) return;
    e.preventDefault();
    d.classList.remove("over");
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) pickFile(d.dataset.drop, f);
  });
  window.addEventListener("hashchange", onHash);
}

/* ---------- boot (keeps state across a republish) ---------- */
function snapshot() {
  const c = JSON.parse(JSON.stringify(S));
  c.forms.login.parol = ""; c.forms.reg.parol = ""; c.forms.reg.parol2 = ""; c.forms.pass = { eski: "", yangi: "" };
  return c;
}
function start(data) {
  S = freshState();
  if (data && data.forms) Object.assign(S, data);
  if (!S.session) S.session = lsGet();
  bindEvents();
  onHash();
  initCaps();
}
const HOT = window.claude && window.claude.hot;
if (HOT && typeof HOT.snapshot === "function") HOT.snapshot(() => snapshot());
if (HOT && typeof HOT.ready === "function") HOT.ready(start);
else start((HOT && HOT.data) || {});

})();
</script>
</body>
